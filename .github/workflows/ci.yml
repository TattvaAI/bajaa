name: BAJAA checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_AUTH_BASE_URL: https://ci.neon.tech/auth
      BAJAA_TEST_URL: http://localhost:8000
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev
      - run: |
          npm run dev > /tmp/bajaa-dev.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:8000 >/dev/null && break; sleep 1; done
          npm test
          npm run test:proxy
          npm run test:queue
          npm run test:account
          npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: docs/screenshots/
